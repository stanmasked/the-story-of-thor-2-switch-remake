name: Stage 109 public SH2 instruction observer
on:
  pull_request:
    paths:
      - 'tools/stage109_patch_mednafen_observer.py'
      - 'tests/test_stage109_patch_mednafen_observer.py'
      - '.github/workflows/stage109-public-sh2-observer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage109-public-observer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic public patch tests
        run: python3 -m unittest discover -s tests -p 'test_stage109_patch_mednafen_observer.py' -v
      - name: Get Debian-packaged open-source Mednafen only
        shell: bash
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config python3 curl libflac-dev liblzo2-dev libmpcdec-dev \
            libsamplerate0-dev libsdl2-dev libtrio-dev libvorbisidec-dev libzstd-dev zlib1g-dev
          mkdir -p /tmp/stage109-public-src
          cd /tmp/stage109-public-src
          base='https://archive.ubuntu.com/ubuntu/pool/universe/m/mednafen'
          curl -fsSL --retry 3 --connect-timeout 12 --max-time 120 "${base}/mednafen_1.29.0%2Bdfsg-1build3.dsc" -o mednafen.dsc
          curl -fsSL --retry 3 --connect-timeout 12 --max-time 120 "${base}/mednafen_1.29.0%2Bdfsg.orig.tar.xz" -o mednafen.tar.xz
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          dsc=Path('mednafen.dsc').read_text()
          expected=re.search(r'^ ([0-9a-f]{64})\s+\d+\s+mednafen_1\.29\.0\+dfsg\.orig\.tar\.xz$',dsc,re.M)
          if not expected: raise SystemExit('trusted source SHA256 absent from official DSC')
          actual=hashlib.sha256(Path('mednafen.tar.xz').read_bytes()).hexdigest()
          if actual!=expected.group(1): raise SystemExit('source archive SHA256 mismatch')
          print('Verified official Ubuntu mednafen 1.29.0 source SHA256')
          PY
          tar -xf mednafen.tar.xz
          test -f mednafen-*/src/ss/ss.cpp
      - name: Insert default-disabled SH2 observer into public Mednafen source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/stage109-public-src/mednafen-*
          python3 "$GITHUB_WORKSPACE/tools/stage109_patch_mednafen_observer.py" src/ss/ss.cpp
          grep -Fq 'STAGE109_SH2_OPT_IN_OBSERVER_V1' src/ss/ss.cpp
      - name: Build public instrumented emulator, no private runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/stage109-public-src/mednafen-*
          ./configure --disable-nls
          make -j 2
          test -x src/mednafen
          mkdir -p "$GITHUB_WORKSPACE/stage109-public-binary"
          cp src/mednafen "$GITHUB_WORKSPACE/stage109-public-binary/mednafen-stage109"
          sha256sum "$GITHUB_WORKSPACE/stage109-public-binary/mednafen-stage109" > "$GITHUB_WORKSPACE/stage109-public-binary/binary-sha256.txt"
          dpkg-query -W -f='mednafen-source-version=${Version}\n' mednafen 2>/dev/null || true
          printf 'observer-version=stage109-sh2-opt-in-v1\nno-rom-or-bios-in-public-ci=true\n' > "$GITHUB_WORKSPACE/stage109-public-binary/provenance.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: stage109-public-instrumented-mednafen
          path: stage109-public-binary/
          if-no-files-found: error
          retention-days: 1