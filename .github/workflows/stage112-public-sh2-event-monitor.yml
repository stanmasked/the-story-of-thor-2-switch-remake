name: Stage 112 public SH2 bounded event monitor
on:
  pull_request:
    paths:
      - 'tools/stage112_patch_mednafen_event_monitor.py'
      - 'tests/test_stage112_patch_mednafen_event_monitor.py'
      - '.github/workflows/stage112-public-sh2-event-monitor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage112-sh2-event-monitor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic-only observer and audit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_stage109_patch_mednafen_observer.py' -v
          python3 -m unittest discover -s tests -p 'test_stage111_patch_mednafen_memory_witness.py' -v
          python3 -m unittest discover -s tests -p 'test_stage112*.py' -v
      - name: Restore public Ubuntu Mednafen source and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo 'deb-src http://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list.d/stage112-mednafen-source.list
          sudo env DEBIAN_FRONTEND=noninteractive timeout 240 apt-get -o Acquire::Retries=1 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 240 apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 install -y --no-install-recommends dpkg-dev build-essential python3
          sudo env DEBIAN_FRONTEND=noninteractive timeout 600 apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 build-dep -y mednafen
          mkdir -p /tmp/stage112-public-source
          cd /tmp/stage112-public-source
          timeout 180 apt-get -o Acquire::Retries=1 source mednafen
          test -f mednafen-*/src/ss/ss.cpp
      - name: Apply three source-only default-disabled instruments
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/stage112-public-source/mednafen-*
          python3 "$GITHUB_WORKSPACE/tools/stage109_patch_mednafen_observer.py" src/ss/ss.cpp
          python3 "$GITHUB_WORKSPACE/tools/stage111_patch_mednafen_memory_witness.py" src/ss/ss.cpp
          python3 "$GITHUB_WORKSPACE/tools/stage112_patch_mednafen_event_monitor.py" src/ss/ss.cpp
          grep -Fq 'STAGE112_PUBLIC_SH2_LIVENESS_MONITOR_V1' src/ss/ss.cpp
      - name: Build and archive redistributable public emulator plus runtime library
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/stage112-public-source/mednafen-*
          ./configure --disable-nls
          make -j 2
          test -x src/mednafen
          dest="$GITHUB_WORKSPACE/stage112-public-only-binary"
          mkdir -p "$dest/lib"
          cp src/mednafen "$dest/mednafen-stage112"
          # Ubuntu runner has FLAC ABI 12; preserve that public shared library
          # to reproduce this public-only build in later private hosts.
          flac=$(ldd src/mednafen | awk '$1=="libFLAC.so.12" {print $3}')
          test -f "$flac"
          cp -L "$flac" "$dest/lib/libFLAC.so.12"
          sha256sum "$dest/mednafen-stage112" "$dest/lib/libFLAC.so.12" > "$dest/public-runtime-sha256.txt"
          printf 'source=ubuntu-noble-mednafen\nobserver=stage112-sh2-events-opt-in\nrom-or-bios-uploaded=false\nprivate-game-data-in-artifact=false\n' > "$dest/provenance.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: stage112-public-only-mednafen-runtime
          path: stage112-public-only-binary/
          if-no-files-found: error
          retention-days: 1