name: Saturn metadata tooling
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    runs-on: ubuntu-latest
    outputs:
      native_changed: ${{ steps.changed-paths.outputs.native_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed-paths
        name: Detect native source changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          elif git rev-parse "$HEAD_SHA^" >/dev/null 2>&1; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          else
            changed="native/unknown"
          fi
          if printf '%s\n' "$changed" | grep -qE '^native/'; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            echo "Native source changes detected; host jobs will run."
          else
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
            echo "No native source changes; host jobs will be skipped."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic-only unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q tools

  native-framebuffer-host:
    needs: python-tests
    if: needs.python-tests.outputs.native_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native ROM-free VDP1 helpers
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Inative native/tests/vdp1_framebuffer_test.cpp -o /tmp/thor2-vdp1-host-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Inative native/tests/vdp1_transfer_descriptor_test.cpp -o /tmp/thor2-vdp1-descriptor-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Inative native/tests/vdp1_stream_layout_test.cpp -o /tmp/thor2-vdp1-stream-layout-test
      - name: Run native VDP1 invariants and synthetic stream tests
        run: |
          /tmp/thor2-vdp1-host-test
          /tmp/thor2-vdp1-descriptor-test
          /tmp/thor2-vdp1-stream-layout-test

  native-gameplay-host:
    needs: python-tests
    if: needs.python-tests.outputs.native_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile original-asset-free C++17 gameplay tests and interactive host demo
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Inative native/tests/sandbox_test.cpp -o /tmp/thor2-sandbox-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Inative native/demo/sandbox_cli.cpp -o /tmp/thor2-sandbox
      - name: Exercise deterministic gameplay, full synthetic goal and rasterizer
        run: /tmp/thor2-sandbox-test
      - name: Exercise scripted host demo and synthetic screenshot
        run: |
          /tmp/thor2-sandbox --help
          /tmp/thor2-sandbox --script='d 20;s 7;e 1' --quiet --ppm=/tmp/thor2-demo.ppm > /tmp/thor2-demo-status.txt
          grep 'sandbox_state_hash=' /tmp/thor2-demo-status.txt
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/thor2-demo.ppm').read_bytes()
          header = b'P6\n320 240\n255\n'
          assert data.startswith(header), 'invalid PPM screenshot header'
          assert len(data) == len(header) + 320 * 240 * 3, 'invalid pixel data size'
          print('synthetic 320x240 PPM frame: PASS')
          PY
      - name: Upload playable Linux host demo and synthetic screenshot
        uses: actions/upload-artifact@v4
        with:
          name: stage62-linux-host-sandbox
          path: |
            /tmp/thor2-sandbox
            /tmp/thor2-demo.ppm
            /tmp/thor2-demo-status.txt
          retention-days: 14
