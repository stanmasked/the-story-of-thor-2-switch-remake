name: Saturn metadata tooling
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic-only Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax check
        run: python -m compileall -q tools
      - name: Compile all native host test programs
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Inative native/tests/vdp1_framebuffer_test.cpp -o /tmp/thor2-vdp1-host-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Inative native/tests/sandbox_test.cpp -o /tmp/thor2-sandbox-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Inative native/demo/sandbox_cli.cpp -o /tmp/thor2-sandbox
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Inative native/tests/switch_platform_test.cpp -o /tmp/thor2-platform-test
      - name: Run native framebuffer, gameplay and platform adapter tests
        run: |
          /tmp/thor2-vdp1-host-test
          /tmp/thor2-sandbox-test
          /tmp/thor2-platform-test
      - name: Exercise scripted host demo and synthetic screenshot
        run: |
          /tmp/thor2-sandbox --help
          /tmp/thor2-sandbox --script='d 20;s 7;e 1' --quiet --ppm=/tmp/thor2-demo.ppm > /tmp/thor2-demo-status.txt
          grep 'sandbox_state_hash=' /tmp/thor2-demo-status.txt
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/thor2-demo.ppm').read_bytes()
          header = b'P6\n320 240\n255\n'
          assert data.startswith(header), 'invalid PPM screenshot header'
          assert len(data) == len(header) + 320 * 240 * 3, 'invalid pixel data size'
          print('synthetic 320x240 PPM frame: PASS')
          PY
      - name: Upload Linux host demo and synthetic screenshot
        uses: actions/upload-artifact@v4
        with:
          name: stage62-linux-host-sandbox
          path: |
            /tmp/thor2-sandbox
            /tmp/thor2-demo.ppm
            /tmp/thor2-demo-status.txt
          retention-days: 14

  switch-nro:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Verify devkitPro and libnx
        run: |
          test -n "$DEVKITPRO"
          test -f "$DEVKITPRO/libnx/switch_rules"
          COMPILER="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"
          if [ ! -x "$COMPILER" ]; then
            echo "Expected compiler not found at: $COMPILER"
            echo "Contents of devkitPro toolchain directories:"
            ls -la "$DEVKITPRO"
            ls -la "$DEVKITPRO/devkitA64/bin" || true
            find "$DEVKITPRO" -maxdepth 5 -type f -name 'aarch64-none-elf-g++' -print
            exit 1
          fi
          echo "$DEVKITPRO/devkitA64/bin" >> "$GITHUB_PATH"
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          command -v aarch64-none-elf-g++
          command -v make
          aarch64-none-elf-g++ --version
      - name: Build Nintendo Switch NRO
        run: |
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make -f Makefile.switch
      - name: Verify NRO artifact exists
        run: |
          test -s thor2-stage63.nro
          ls -lh thor2-stage63.nro
      - name: Upload Nintendo Switch NRO
        uses: actions/upload-artifact@v4
        with:
          name: stage63-switch-nro
          path: thor2-stage63.nro
          retention-days: 14
