name: Saturn metadata tooling
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Run feature-branch validation through PRs, not duplicate push events.
# Cancel stale PR revisions while preserving main and manual runs.
concurrency:
  group: thor2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic-only unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q tools
